<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>بەڕێوەبەری فێرخوازان</title>
    <link rel="manifest" href='data:application/manifest+json;utf8,{"name":"مودیریەتی فێرخوازان","short_name":"فێرخوازان","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#4f46e5","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
    <meta name="theme-color" content="#4F46E5" />
    <meta name="background-color" content="#F3F4F6" />
    
    <!-- iOS / Apple Specific Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="فێرخوازان">
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'app-cache-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(['./', 'index.html']))
            );
          });
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW registration failed:', err));
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
